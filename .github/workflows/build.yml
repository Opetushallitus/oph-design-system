name: oph-design-system
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-storybook
        with:
          params: --test
      - name: Lint
        run: |
          npm run typecheck
          npm run lint
          npm run prettier

      - name: Run unit tests
        run: npm run test:coverage
  test-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-storybook
        with:
          params: --test
      - name: Test running example project with library import
        run: cd example; npm run start-and-test-docker
      - name: Start and test storybook
        run: npm run start-and-test-storybook-docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: |
            test-results
            !test-results/.last-run.json
          retention-days: 10
          if-no-files-found: ignore

  publish:
    needs: [check-and-test, test-playwright]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-storybook
        if: github.ref == 'refs/heads/main'
      - uses: ./.github/actions/deploy-storybook
        if: github.ref == 'refs/heads/main'
      - uses: ./.github/actions/publish-package
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
